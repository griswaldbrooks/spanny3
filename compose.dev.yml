services:
  development:
    build:
      args:
        UID: ${USER_UID:-1000}
        GID: ${USER_GID:-1000}
        USER: ${USER}
      context: .
      dockerfile: Dockerfile
    command: bash
    container_name: ${USER}-${REPO}-dev
    environment:
      - TERM=xterm-256color
    extra_hosts:
      - ${REPO}-dev:127.0.0.1
    hostname: ${REPO}-dev
    image: ${REPO}-dev:latest
    network_mode: host
    privileged: true
    volumes:
      - /dev:/dev
      - ~/.ssh:${HOME}/.ssh:ro
      - ~/.gitconfig:${HOME}/.gitconfig:ro
      - ${PWD}:${HOME}/ws/src/${REPO}
      - ~/.${REPO}:${HOME}/ws/artifacts
      - /etc/group:/etc/group:ro
      - /etc/passwd:/etc/passwd:ro
      - /etc/shadow:/etc/shadow:ro
    working_dir: ${HOME}/ws
