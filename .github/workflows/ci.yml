name: ci

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: ${{matrix.platform.name}} ${{matrix.type.name}} ${{matrix.config.name}}
    runs-on: ${{matrix.platform.os}}
    container: ghcr.io/griswaldbrooks/spanny3:upstream
    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: Linux,   os: ubuntu-latest }
        compiler:
        - { name: Clang, cc: clang-18, cxx: clang++-18, flags: "-stdlib=libc++" }
        type:
        - { name: Shared, flags: "ON" }
        - { name: Static, flags: "OFF" }
        config:
        - { name: Debug }
        - { name: Release }

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure
      env:
        CC: ${{ matrix.compiler.cc }}
        CXX: ${{ matrix.compiler.cxx }}
      run: cmake -B build -DBUILD_SHARED_LIBS=${{matrix.type.flags}} -DCMAKE_BUILD_TYPE=${{matrix.config.name}} -DCMAKE_CXX_FLAGS=${{matrix.compiler.flags}}

    - name: Build
      run: cmake --build build --config ${{matrix.config.name}}

    - name: Test
      run: ctest --test-dir build --output-on-failure --build-config ${{matrix.config.name}}

  coverage:
    name: Coverage Analysis
    runs-on: ubuntu-latest
    container: ghcr.io/griswaldbrooks/spanny3:upstream

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure Coverage Build
      env:
        CC: clang-18
        CXX: clang++-18
      run: cmake -B build -DCMAKE_BUILD_TYPE=Coverage -DCMAKE_CXX_FLAGS="-stdlib=libc++"

    - name: Build with Coverage
      run: cmake --build build --config Coverage

    - name: Run Coverage Analysis
      run: cmake --build build --target coverage

    - name: Upload Coverage Reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          build/coverage/reports/
        retention-days: 30

    - name: Display Coverage Summary
      run: |
        echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat build/coverage/reports/coverage.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
